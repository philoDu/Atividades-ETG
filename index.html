<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades-ETG - Índice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        main {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .item:hover {
            border-color: #667eea;
            background-color: #f5f5ff;
            transform: translateX(5px);
        }

        .item-icon {
            font-size: 1.8em;
            margin-right: 15px;
            min-width: 30px;
        }

        .item-content h3 {
            color: #333;
            font-size: 1.05em;
            margin-bottom: 3px;
        }

        .item-content p {
            color: #666;
            font-size: 0.85em;
        }

        .folder {
            color: #667eea;
            font-weight: 600;
        }

        .file {
            color: #333;
        }

        .github-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: transform 0.3s ease;
        }

        .github-link:hover {
            transform: scale(1.05);
        }

        footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Atividades-ETG</h1>
            <p>Tarefas e exercícios do curso de qualificação profissional</p>
            <p>Programador Web - Escola Técnica do Guará</p>
        </header>

        <main id="content">
            <div class="loading">⏳ Carregando conteúdo do repositório...</div>
        </main>

        <footer>
            <p>Acesse o repositório completo no <a href="https://github.com/philoDu/Atividades-ETG" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script>
        const owner = 'philoDu';
        const repo = 'Atividades-ETG';
        const token = ''; // GitHub API funciona sem token para repos públicos

        async function fetchRepoContents(path = '') {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Erro ao buscar conteúdo:', error);
                return null;
            }
        }

        function getGithubUrl(item) {
            return `https://github.com/${owner}/${repo}/${item.type === 'dir' ? 'tree' : 'blob'}/main/${item.path}`;
        }

        async function buildIndex() {
            const contents = await fetchRepoContents();
            
            if (!contents) {
                document.getElementById('content').innerHTML = 
                    '<div class="error">❌ Erro ao carregar o conteúdo do repositório. Tente novamente mais tarde.</div>';
                return;
            }

            // Separar pastas e arquivos
            const folders = contents.filter(item => item.type === 'dir').sort((a, b) => a.name.localeCompare(b.name));
            const files = contents.filter(item => item.type === 'file').sort((a, b) => a.name.localeCompare(b.name));

            let html = '';

            // Seção de Pastas
            if (folders.length > 0) {
                html += '<div class="section">';
                html += '<h2>📁 Pastas</h2>';
                html += '<div class="items-grid">';
                
                for (const folder of folders) {
                    const url = getGithubUrl(folder);
                    html += `
                        <a href="${url}" target="_blank" class="item">
                            <div class="item-icon">📂</div>
                            <div class="item-content">
                                <h3 class="folder">${folder.name}</h3>
                                <p>Acessar pasta</p>
                            </div>
                        </a>
                    `;
                }
                
                html += '</div></div>';
            }

            // Seção de Arquivos
            if (files.length > 0) {
                html += '<div class="section">';
                html += '<h2>📄 Arquivos</h2>';
                html += '<div class="items-grid">';
                
                for (const file of files) {
                    const url = getGithubUrl(file);
                    const isMarkdown = file.name.endsWith('.md');
                    const icon = isMarkdown ? '📋' : '📃';
                    
                    html += `
                        <a href="${url}" target="_blank" class="item">
                            <div class="item-icon">${icon}</div>
                            <div class="item-content">
                                <h3 class="file">${file.name}</h3>
                                <p>${(file.size / 1024).toFixed(1)} KB</p>
                            </div>
                        </a>
                    `;
                }
                
                html += '</div></div>';
            }

            html += `
                <div style="text-align: center; margin-top: 40px;">
                    <a href="https://github.com/philoDu/Atividades-ETG" target="_blank" class="github-link">
                        🔗 Ver no GitHub
                    </a>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        // Carregar conteúdo quando a página terminar de carregar
        window.addEventListener('load', buildIndex);
    </script>
</body>
</html>
